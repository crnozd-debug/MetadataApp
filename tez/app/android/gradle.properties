org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Ağ bağlantı sorunları için yeniden deneme ve zaman aşımı
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000
org.gradle.internal.repo.user.agent=gradle

# Gradle daemon ayarları
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true
